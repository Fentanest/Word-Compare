name: Build And Release Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metadata:
    name: Resolve Version And Tag
    runs-on: [self-hosted, Windows, X64, 233]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tag_check.outputs.tag_exists }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Resolve version
      id: version
      shell: pwsh
      run: |
        $version = python -c "from version import __version__; print(__version__)"
        "version=$version" >> $env:GITHUB_OUTPUT
        "tag=v$version" >> $env:GITHUB_OUTPUT
        Write-Host "Resolved version $version"

    - name: Check if tag already exists
      id: tag_check
      shell: pwsh
      run: |
        git fetch --tags --force
        git show-ref --tags --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"
        if ($LASTEXITCODE -eq 0) {
          "tag_exists=true" >> $env:GITHUB_OUTPUT
          Write-Host "Tag ${{ steps.version.outputs.tag }} already exists. Skipping package build."
        } else {
          "tag_exists=false" >> $env:GITHUB_OUTPUT
          Write-Host "Tag ${{ steps.version.outputs.tag }} does not exist. Proceeding with package build."
        }

  build-windows:
    name: Build Windows Package
    needs: metadata
    if: needs.metadata.outputs.tag_exists != 'true'
    runs-on: [self-hosted, Windows, X64, 233]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build packaged application
      shell: cmd
      run: scripts\build_app.bat

    - name: Upload packaged Windows artifact
      uses: actions/upload-artifact@v7
      with:
        name: WordCompare-Windows-${{ needs.metadata.outputs.version }}
        path: build/package/WordCompare-Windows-${{ needs.metadata.outputs.version }}.zip

  release:
    name: Create Release
    needs: [metadata, build-windows]
    if: needs.metadata.outputs.tag_exists != 'true'
    runs-on: [self-hosted, Windows, X64, 233]
    permissions:
      contents: write
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v5
      with:
        name: WordCompare-Windows-${{ needs.metadata.outputs.version }}
        path: release-assets

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2.5.0
      with:
        tag_name: ${{ needs.metadata.outputs.tag }}
        name: "Word Compare Tool ${{ needs.metadata.outputs.tag }}"
        body: |
          Automated release of Word Compare Tool ${{ needs.metadata.outputs.tag }}.
          Commit: ${{ github.sha }}
        files: release-assets/*
        draft: false
        prerelease: false
        generate_release_notes: true
