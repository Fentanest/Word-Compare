name: Build And Release Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metadata:
    name: Resolve Version And Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tag_check.outputs.tag_exists }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Resolve version
      id: version
      shell: bash
      run: |
        VERSION="$(python -c "from version import __version__; print(__version__)")"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Resolved version ${VERSION}"

    - name: Check if tag already exists
      id: tag_check
      shell: bash
      run: |
        git fetch --tags --force
        if git show-ref --tags --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"; then
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          echo "Tag ${{ steps.version.outputs.tag }} already exists. Skipping package build."
        else
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          echo "Tag ${{ steps.version.outputs.tag }} does not exist. Proceeding with package build."
        fi

  build-windows:
    name: Build Windows Package
    needs: metadata
    if: needs.metadata.outputs.tag_exists != 'true'
    runs-on: [self-hosted, Windows, X64, 230]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build packaged application
      shell: cmd
      run: scripts\build_app.bat

    - name: Upload packaged Windows artifact
      uses: actions/upload-artifact@v7
      with:
        name: WordCompare-Windows-${{ needs.metadata.outputs.version }}
        path: build/package/WordCompare-Windows-${{ needs.metadata.outputs.version }}.zip

  build-linux:
    name: Build Linux Package
    needs: metadata
    if: needs.metadata.outputs.tag_exists != 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install Linux packaging dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0

    - name: Build packaged application
      shell: bash
      run: bash scripts/build_app.sh

    - name: Upload packaged Linux artifact
      uses: actions/upload-artifact@v7
      with:
        name: WordCompare-Linux-${{ needs.metadata.outputs.version }}
        path: build/package/WordCompare-Linux-${{ needs.metadata.outputs.version }}.tar.gz

  release:
    name: Create Release
    needs: [metadata, build-windows, build-linux]
    if: needs.metadata.outputs.tag_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v5
      with:
        name: WordCompare-Windows-${{ needs.metadata.outputs.version }}
        path: release-assets

    - name: Download Linux artifact
      uses: actions/download-artifact@v5
      with:
        name: WordCompare-Linux-${{ needs.metadata.outputs.version }}
        path: release-assets

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2.5.0
      with:
        tag_name: ${{ needs.metadata.outputs.tag }}
        name: "Word Compare Tool ${{ needs.metadata.outputs.tag }}"
        body: |
          Automated release of Word Compare Tool ${{ needs.metadata.outputs.tag }}.
          Commit: ${{ github.sha }}
        files: release-assets/*
        draft: false
        prerelease: false
        generate_release_notes: true
