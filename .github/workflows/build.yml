name: Build And Release Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metadata:
    name: Resolve Version And Tag
    runs-on: [self-hosted, Windows, X64, 233]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tag_check.outputs.tag_exists }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Resolve version
      id: version
      shell: cmd
      run: |
        for /f "usebackq delims=" %%v in (`python -c "from version import __version__; print(__version__)"`) do set VERSION=%%v
        echo version=%VERSION%>> %GITHUB_OUTPUT%
        echo tag=v%VERSION%>> %GITHUB_OUTPUT%
        echo Resolved version %VERSION%

    - name: Check if tag already exists
      id: tag_check
      shell: cmd
      run: |
        git fetch --tags --force
        if errorlevel 1 exit /b %errorlevel%
        git show-ref --tags --verify --quiet "refs/tags/${{ steps.version.outputs.tag }}"
        if not errorlevel 1 (
          echo tag_exists=true>> %GITHUB_OUTPUT%
          echo Tag ${{ steps.version.outputs.tag }} already exists. Skipping package build.
        ) else (
          echo tag_exists=false>> %GITHUB_OUTPUT%
          echo Tag ${{ steps.version.outputs.tag }} does not exist. Proceeding with package build.
        )
        exit /b 0

  build-windows:
    name: Build Windows Package
    needs: metadata
    if: needs.metadata.outputs.tag_exists != 'true'
    runs-on: [self-hosted, Windows, X64, 233]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build packaged application
      shell: cmd
      run: scripts\build_app.bat

    - name: Upload packaged Windows artifact
      uses: actions/upload-artifact@v7
      with:
        name: WordCompare-Windows-${{ needs.metadata.outputs.version }}
        path: build/package/WordCompare-Windows-${{ needs.metadata.outputs.version }}.zip

  release:
    name: Create Release
    needs: [metadata, build-windows]
    if: needs.metadata.outputs.tag_exists != 'true'
    runs-on: [self-hosted, Windows, X64, 233]
    permissions:
      contents: write
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v5
      with:
        name: WordCompare-Windows-${{ needs.metadata.outputs.version }}
        path: release-assets

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2.5.0
      with:
        tag_name: ${{ needs.metadata.outputs.tag }}
        name: "Word Compare Tool ${{ needs.metadata.outputs.tag }}"
        body: |
          Automated release of Word Compare Tool ${{ needs.metadata.outputs.tag }}.
          Commit: ${{ github.sha }}
        files: release-assets/*
        draft: false
        prerelease: false
        generate_release_notes: true
